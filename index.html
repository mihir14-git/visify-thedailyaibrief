<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visify // The Daily AI Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A;
    --card-bg: #101012;
    --card-border: rgba(255,255,255,0.08);
    --text-primary: #FFFFFF;
    --text-secondary: #8B8F98;
    --accent: #2F6FFF;
    --accent-glow: rgba(47,111,255,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* faint dot-grid texture across the whole page */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 75% 55% at 50% 38%, black 0%, transparent 72%);
    mask-image: radial-gradient(ellipse 75% 55% at 50% 38%, black 0%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  /* ambient blue glow behind card, two soft layers for depth */
  body::before {
    content: "";
    position: absolute;
    top: 42%;
    left: 50%;
    width: 720px;
    height: 720px;
    background:
      radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 42%),
      radial-gradient(circle at 40% 60%, rgba(255,255,255,0.03) 0%, transparent 40%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  /* subtle grain for texture, sits above everything else */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: overlay;
  }

  header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px clamp(20px, 5vw, 48px);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
  }

  header .brand {
    color: var(--text-primary);
    font-weight: 600;
  }

  .x-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    color: var(--text-secondary);
    transition: color 0.15s ease, background 0.15s ease;
  }

  .x-icon:hover {
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
  }

  .x-icon:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .x-icon svg { width: 16px; height: 16px; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 408px;
    background:
      radial-gradient(circle at 100% 0%, rgba(47,111,255,0.12) 0%, transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(47,111,255,0.05) 0%, transparent 40%),
      var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 44px 34px 34px;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 28px;
    right: 28px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.7;
  }

  .corner-tick {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid rgba(47,111,255,0.35);
    opacity: 0.9;
  }

  .corner-tick.tl { top: 16px; left: 16px; border-right: none; border-bottom: none; border-top-left-radius: 4px; }
  .corner-tick.br { bottom: 16px; right: 16px; border-left: none; border-top: none; border-bottom-right-radius: 4px; }

  .signal {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #A8C1FF;
    margin-bottom: 26px;
    padding: 6px 13px;
    border: 1px solid rgba(47,111,255,0.32);
    border-radius: 100px;
    background: rgba(47,111,255,0.08);
    box-shadow: 0 0 20px -6px var(--accent-glow);
  }

  .signal-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,111,255,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(47,111,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,111,255,0); }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }

  h1 span {
    display: block;
    background: linear-gradient(90deg, #6E9BFF, var(--accent) 65%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-secondary);
    margin-bottom: 30px;
    max-width: 30ch;
  }

  .btn-primary {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: linear-gradient(180deg, #4C82FF, var(--accent));
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    padding: 15px 20px;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-primary svg {
    width: 16px;
    height: 16px;
    transition: transform 0.15s ease;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px -10px var(--accent-glow);
  }

  .btn-primary:hover svg {
    transform: translate(2px, -2px);
  }

  .btn-primary:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--card-border);
    margin: 30px 0 22px;
  }

  .lead-magnet-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .lead-magnet-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .lead-magnet-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: rgba(47,111,255,0.1);
    border: 1px solid rgba(47,111,255,0.2);
    color: var(--accent);
    margin-top: 1px;
  }

  .lead-magnet-icon svg { width: 14px; height: 14px; }

  .lead-magnet-item {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .lead-magnet-item strong {
    color: var(--text-primary);
    font-weight: 500;
  }

  @media (prefers-reduced-motion: reduce) {
    .signal-dot { animation: none; }
  }
</style>
</head>
<body>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>

<header>

</body>
</html>
